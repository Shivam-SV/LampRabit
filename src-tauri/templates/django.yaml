schema: 1
id: django
name: Django
description: A Django project in its own virtual environment, with the admin and SQLite ready.
icon: leaf
color: green
duration: pip · under a minute
requires:
  python: "3.10"
steps:
  - name: Creating a virtual environment (.venv)
    run: python -m venv .venv
  - name: Installing Django
    run: "{{venv.python}} -m pip install --disable-pip-version-check django"
  - name: Creating the project
    run: "{{venv.python}} -m django startproject config ."
  - name: Allowing {{domain}}
    append:
      path: config/settings.py
      content: |

        # Added by LampRabit: the project is served at {{url}}, through its web server.
        ALLOWED_HOSTS = ["127.0.0.1", "localhost", "{{domain}}", ".{{domain}}"]
        CSRF_TRUSTED_ORIGINS = ["{{url}}"]
  - name: Creating the database (SQLite)
    run: "{{venv.python}} manage.py migrate"
  - name: Writing requirements.txt
    run: "{{venv.python}} -m pip freeze --disable-pip-version-check > requirements.txt"
  - name: Ignoring the virtual environment in Git
    write:
      path: .gitignore
      content: |
        .venv/
        __pycache__/
        *.pyc
        db.sqlite3
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New Django project
serve:
  mode: dynamic
  command: "{{venv.python}} manage.py runserver 127.0.0.1:{port}"
commands:
  list:
    - name: Make migrations
      run: "{{venv.python}} manage.py makemigrations"
    - name: Migrate
      run: "{{venv.python}} manage.py migrate"
    - name: Run the tests
      run: "{{venv.python}} manage.py test"
done: Start it from the Sites page; it's served at {{url}}. For the admin at {{url}}/admin/, create a user in the project's terminal with {{venv.python}} manage.py createsuperuser.
