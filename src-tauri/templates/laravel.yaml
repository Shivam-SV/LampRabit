schema: 1
id: laravel
name: Laravel
description: Latest Laravel, configured for your database and Mailpit.
icon: flame
color: red
duration: Composer · about a minute
requires:
  php: "8.2"
  extensions: [ctype, fileinfo, mbstring, openssl, tokenizer, xml]
database: optional
engines: [mariadb, mysql, postgres, sqlite]
steps:
  # First, so a database name that's taken stops everything before the long download.
  - create_database: {}
  - name: Creating the project with Composer (laravel/laravel)
    cwd: www
    composer: [create-project, laravel/laravel, "{{project}}", --prefer-dist, --no-interaction, --no-progress]
  - name: Configuring the environment
    env:
      values:
        APP_URL: "{{url}}"
        MAIL_MAILER: smtp
        MAIL_HOST: "{{mail.host}}"
        MAIL_PORT: "{{mail.port}}"
  - name: Connecting the database
    if: database
    env:
      values:
        DB_CONNECTION: "{{db.engine}}"
        DB_HOST: "{{db.host}}"
        DB_PORT: "{{db.port}}"
        DB_DATABASE: "{{database}}"
        DB_USERNAME: "{{db.user}}"
        DB_PASSWORD: "{{db.password}}"
  - name: Running database migrations
    if: database
    php: [artisan, migrate, --force]
  - id: frontend
    optional: true
    default: false
    label: Install and build the frontend with npm
    needs: [node]
    name: Building the frontend with npm
    run: npm install && npm run build
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New Laravel project
commands:
  discover: [artisan, composer.json, package.json]
  list:
    - name: Run the tests
      run: php artisan test
    - name: Clear every cache
      run: php artisan optimize:clear
    - name: Rebuild the database with seed data
      run: php artisan migrate:fresh --seed --force
      description: Drops every table, migrates again and runs the seeders.
processes:
  # Laravel's queue runs jobs in the background; start it from Commands → Keep running.
  - name: queue
    command: php artisan queue:work --tries=3
    restart: always
    autostart: false
