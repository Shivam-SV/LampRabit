schema: 1
id: cakephp
name: CakePHP
description: CakePHP 5 app skeleton, connected to your database.
icon: cake
color: rose
duration: Composer · about a minute
requires:
  php: "8.1"
  extensions: [intl, mbstring, simplexml]
database: optional
engines: [mariadb, mysql, postgres]
steps:
  - create_database: {}
  - name: Creating the project with Composer (cakephp/app)
    cwd: www
    composer: [create-project, cakephp/app, "{{project}}", --prefer-dist, --no-interaction, --no-progress]
  # app.php names the MySQL driver for every connection; app_local.php overrides it.
  # Before the step below, which changes the host this looks for.
  - name: Connecting the database
    if: db.pdo == pgsql
    replace:
      file: config/app_local.php
      values:
        "'host' => 'localhost',": "'driver' => \\Cake\\Database\\Driver\\Postgres::class,\n            'host' => 'localhost',"
  - name: Connecting the database
    if: database
    replace:
      file: config/app_local.php
      values:
        "'host' => 'localhost'": "'host' => '{{db.host}}'"
        "//'port' => 'non_standard_port_number'": "'port' => '{{db.port}}'"
        "'username' => 'my_app'": "'username' => '{{db.user}}'"
        "'password' => 'secret'": "'password' => '{{db.password}}'"
        "'database' => 'my_app'": "'database' => '{{database}}'"
  - id: git
    optional: true
    default: false
    label: Initialise a Git repository
    needs: [git]
    git_init:
      commit: New CakePHP project
commands:
  discover: [cake, composer.json]
  list:
    - name: Clear every cache
      run: php bin/cake.php cache clear_all
